name: Bump Binaries

on:
  schedule:
    - cron: '0 4 * * 1' # Run every Monday at 4:00 AM UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  bump-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup jq
        run: sudo apt-get install -y jq

      - name: Run bump script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./ci/scripts/bump-binaries.sh

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet ci/docker/dependencies.json; then
            echo "No changes detected. Dependencies are up to date."
            exit 0
          fi
          
          BRANCH_NAME="bump-binaries-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git add ci/docker/dependencies.json
          git commit -m "Update binary dependencies in dependencies.json"
          git push origin $BRANCH_NAME
          
          gh pr create \
            --title "Update binary dependencies" \
            --body "This PR automatically updates the binary dependencies in \`ci/docker/dependencies.json\`." \
            --base windows-2019 \
            --head $BRANCH_NAME
